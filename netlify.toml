# Netlify build for app-lite, the SvelteKit thin client.
#
# Builds run from one place: the `Netlify Deploy` GitHub Actions workflow
# (.github/workflows/netlify.yml), dispatched by hand, which deploys with
# `netlify deploy --build`. That path supplies DEPLOY_URL — the URL of the
# deploy being built — so the bundle is built for the origin it will be served
# from; scripts/netlify_build.sh derives the OAuth client metadata and the
# shareable-link origin from it. Nothing else builds this site: `ignore`
# below stops the automatic build of every push, pull request, and agent run,
# which would otherwise rebuild the site without a deploy URL to bake in.
#
# The Netlify site itself needs no build settings in the UI: this file carries
# the command, the publish directory, and the redirects.

[build]
  command = "bash scripts/netlify_build.sh"
  publish = "packages/app-lite/build"
  # `ignore` runs as a git-integration hook, before the build; exit 0 means
  # "nothing changed, skip this deploy". It is not consulted by a locally run
  # build, so a dispatched `netlify deploy --build` ignores it — see
  # scripts/netlify_build.sh and the workflow for the build that does run.
  ignore = "true"

[build.environment]
  # The root package.json requires ^22.15.0; Netlify's default is older.
  # The app-lite vite build is at Netlify's default heap ceiling.
  NODE_OPTIONS = "--max-old-space-size=4096"
  NODE_VERSION = "22.15.0"

# adapter-static (see packages/app-lite/svelte.config.js) emits a single-page
# app with an index.html fallback: every unknown path is a client route and
# must serve the app shell with a 200, so deep links such as invite links
# resolve. Files that exist win over these rules — the rules only decide what
# happens when nothing is on disk at the requested path.
#
# The Apple App Site Association comes FIRST because Netlify applies the first
# matching rule: this path is the file Apple fetches before it lets a shared
# `https://` link open the iOS app, and the catch-all below would answer it with
# the HTML shell. A deployment that is the host the app claims serves the file
# from disk; one that is not carries no file at all, and a miss is a 404, which
# is what Apple should see. (Caddy holds the same line; see its `handle` for
# this path.)
[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Content-hashed assets must never fall back to the shell. Serving index.html
# (200 text/html) under a .js/.css URL is a module-load failure in every
# browser — "Failed to fetch dynamically imported module", "doesn't provide an
# export named" — and because the fallback is a cacheable 200 a CDN stores the
# bad body and keeps serving it after the deploy that caused it. Nothing under
# /_app/ is a client route, so an asset the build did not emit is a miss, not
# a route.
[[redirects]]
  from = "/_app/*"
  to = "/index.html"
  status = 404

# ── Litestream replication config ────────────────────────────────────────
# Continuously replicates the appserver's static SQLite databases (WAL mode)
# to S3-compatible storage. Used at runtime by the Docker entrypoint on
# Railway.
#
# The appserver's per-space database split means there are two kinds of data:
#
#   Static files replicated here:
#     /app/data/roomy-events.sqlite    - append-only event log (ULTIMATE source
#                                         of truth; re-materialisation replays it)
#     /app/data/roomy-readstate.sqlite - read-state (unread counts; persistent
#                                         source of truth)
#     /app/data/global.sqlite           - cross-space membership / profiles
#
#   Derived, regenerable (NOT replicated):
#     /app/data/spaces/<spaceDid>.sqlite - per-space materialised DBs. Created
#                                          lazily and re-materialised from the
#                                          event log on first access, so after a
#                                          restore they rebuild on demand.
#
# Litestream needs static `dbs:` entries, so the dynamic per-space files are
# intentionally excluded — they are derived data and self-rebuild. See
# packages/appserver/docs/plans/per-space-dbs.md ("Data Classification").
#
# Credentials are injected by Railway S3 object storage (when a bucket is
# linked to this service) as S3_BUCKET / S3_ENDPOINT / S3_REGION /
# S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY. Litestream substitutes ${VAR}
# placeholders at startup.

dbs:
  - path: /app/data/roomy-events.sqlite
    replicas:
      - type: s3
        bucket: ${S3_BUCKET}
        path: appserver/roomy-events.sqlite
        endpoint: ${S3_ENDPOINT}
        region: ${S3_REGION}
        access-key-id: ${S3_ACCESS_KEY_ID}
        secret-access-key: ${S3_SECRET_ACCESS_KEY}
        force-path-style: true

  - path: /app/data/roomy-readstate.sqlite
    replicas:
      - type: s3
        bucket: ${S3_BUCKET}
        path: appserver/roomy-readstate.sqlite
        endpoint: ${S3_ENDPOINT}
        region: ${S3_REGION}
        access-key-id: ${S3_ACCESS_KEY_ID}
        secret-access-key: ${S3_SECRET_ACCESS_KEY}
        force-path-style: true

  - path: /app/data/global.sqlite
    replicas:
      - type: s3
        bucket: ${S3_BUCKET}
        path: appserver/global.sqlite
        endpoint: ${S3_ENDPOINT}
        region: ${S3_REGION}
        access-key-id: ${S3_ACCESS_KEY_ID}
        secret-access-key: ${S3_SECRET_ACCESS_KEY}
        force-path-style: true
